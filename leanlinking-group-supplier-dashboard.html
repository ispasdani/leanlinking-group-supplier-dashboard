<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Group supplier dashboard</title>
<style>
  :root {
    color-scheme: light;
    --canvas: #F5F7FC;
    --card: #FFFFFF;
    --line: #D9DFEE;
    --line-soft: #E9EDF7;
    --ink: #1A2340;
    --muted: #5B6478;
    --navy: #0E1F52;
    --blue: #1D4ED8;
    --blue-soft: #DCE4FA;
    --good: #1E8E5A;  --good-bg: #E1F3EA;  --good-ink: #0F5C3A;
    --warn: #E39B1B;  --warn-bg: #FCEFD3;  --warn-ink: #7A4D00;
    --bad:  #CF3F3F;  --bad-bg:  #FAE0E0;  --bad-ink:  #8F1F1F;
    --font: "Segoe UI", "Segoe UI Web (West European)", Inter, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--canvas); color: var(--ink); }
  body { font: 13px/1.4 var(--font); padding: 12px 14px 0; min-height: 100vh; display: flex; flex-direction: column; font-variant-numeric: tabular-nums; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 3px; }
  h1, h2, h3, p { margin: 0; }

  /* Report header */
  #app { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; }
  .head h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; color: var(--navy); }
  .head .sub { color: var(--muted); font-size: 12px; margin-top: 1px; }
  .viewas { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .viewas select { border: 1px solid var(--line); background: var(--card); border-radius: 3px; padding: 4px 6px; color: var(--ink); max-width: 260px; }
  .viewas strong { color: var(--ink); font-weight: 600; }

  /* Drill rail: the four levels RSK asks for, always visible */
  .rail { display: flex; align-items: stretch; gap: 8px; margin-bottom: 10px; }
  .rail .up { border: 1px solid var(--line); background: var(--card); border-radius: 3px; padding: 0 12px; font-weight: 600; color: var(--navy); white-space: nowrap; }
  .rail .up:disabled { color: #A7AEC2; background: transparent; }
  .rail .up:not(:disabled):hover { background: var(--blue-soft); border-color: var(--blue); }
  .rail ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
  .rail li { position: relative; min-width: 0; }
  .rail li + li { border-left: 1px solid var(--line); }
  .rail .seg { display: block; width: 100%; height: 100%; text-align: left; border: 0; background: transparent; padding: 6px 12px 7px; min-width: 0; }
  .rail .seg-k { display: block; font-size: 11px; color: var(--muted); }
  .rail .seg-v { display: block; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rail .is-set .seg-v { color: var(--blue); }
  .rail .is-set .seg:hover { background: var(--blue-soft); }
  .rail .is-current { background: var(--navy); }
  .rail .is-current .seg-k { color: #B9C4E6; }
  .rail .is-current .seg-v { color: #FFFFFF; }
  .rail .is-open .seg-v { color: var(--ink); font-weight: 400; }
  .rail .is-later .seg-v { color: #8F97AD; font-weight: 400; }
  .rail .is-locked .seg-v { color: var(--muted); font-weight: 400; }

  /* Slicers */
  .slicers { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: flex-end; margin-bottom: 10px; }
  .slicer { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--muted); }
  .slicer select { min-width: 150px; border: 1px solid var(--line); border-radius: 3px; background: var(--card); padding: 5px 6px; font-size: 13px; color: var(--ink); }
  .slicer select.on { border-color: var(--blue); background: var(--blue-soft); }
  .link { border: 0; background: none; color: var(--blue); padding: 6px 2px; font-size: 12px; }
  .link:hover { text-decoration: underline; }
  .link:disabled { color: #A7AEC2; text-decoration: none; }

  /* Visual containers */
  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 10px; align-content: start; flex: 1; padding-bottom: 12px; }
  .vis { background: var(--card); border: 1px solid var(--line); border-radius: 3px; padding: 10px 12px 12px; min-width: 0; display: flex; flex-direction: column; }
  .vis-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .vis-h h2 { font-size: 13px; font-weight: 600; color: var(--ink); }
  .vis-h p { font-size: 11px; color: var(--muted); }
  .c12 { grid-column: span 12; } .c8 { grid-column: span 8; } .c7 { grid-column: span 7; } .c5 { grid-column: span 5; } .c4 { grid-column: span 4; } .c3 { grid-column: span 3; }

  /* KPI cards */
  .kpis { grid-column: span 12; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
  .kpi { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 3px; padding: 9px 12px 10px; border-top: 3px solid var(--navy); min-width: 0; }
  button.kpi:hover { border-color: var(--blue); border-top-color: var(--blue); background: #FBFCFF; }
  .kpi.t-good { border-top-color: var(--good); } .kpi.t-warn { border-top-color: var(--warn); } .kpi.t-bad { border-top-color: var(--bad); }
  .kpi-l { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi-v { display: block; font-size: 30px; font-weight: 300; line-height: 1.15; color: var(--navy); letter-spacing: -0.01em; }
  .kpi-v small { font-size: 15px; font-weight: 400; color: var(--muted); }
  .kpi-s { display: block; font-size: 11px; color: var(--muted); }

  /* Segmented toggle */
  .seg-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; flex: none; }
  .seg-toggle button { border: 0; background: var(--card); padding: 3px 9px; font-size: 12px; color: var(--muted); }
  .seg-toggle button + button { border-left: 1px solid var(--line); }
  .seg-toggle button[aria-pressed="true"] { background: var(--navy); color: #fff; }

  /* Bar visual */
  .bars { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; max-height: 268px; padding-right: 2px; }
  .bar-row { display: grid; grid-template-columns: minmax(90px, 38%) 1fr 44px; align-items: center; gap: 8px; border: 0; background: none; padding: 4px 4px; text-align: left; border-radius: 2px; }
  .bar-row:hover { background: var(--canvas); }
  .bar-n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-row:hover .bar-n { color: var(--blue); text-decoration: underline; }
  .bar-row.is-story .bar-n { font-weight: 600; }
  .track { position: relative; height: 14px; background: var(--line-soft); border-radius: 1px; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 1px; background: var(--blue); }
  .fill.good { background: var(--good); } .fill.warn { background: var(--warn); } .fill.bad { background: var(--bad); } .fill.neutral { background: var(--navy); }
  .mark { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 2px dashed var(--ink); opacity: .55; }
  .bar-v { text-align: right; font-weight: 600; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11px; color: var(--muted); margin-top: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 4px; vertical-align: -1px; border-radius: 1px; }
  .legend .dash { width: 0; height: 11px; border-left: 2px dashed var(--ink); opacity: .55; border-radius: 0; }

  /* Risk x compliance matrix */
  .mx { display: grid; grid-template-columns: auto repeat(3, minmax(0, 1fr)); gap: 4px; align-items: stretch; }
  .mx .mx-h { font-size: 11px; color: var(--muted); padding: 0 2px 2px; text-align: center; align-self: end; }
  .mx .mx-r { font-size: 12px; padding-right: 6px; align-self: center; white-space: nowrap; }
  .mx button { border: 1px solid transparent; border-radius: 2px; padding: 10px 4px; font-size: 20px; font-weight: 300; min-height: 58px; color: var(--ink); background: var(--line-soft); }
  .mx button:not(:disabled):hover { border-color: var(--ink); }
  .mx button:disabled { color: #A7AEC2; background: #F3F5FA; }
  .mx .s0 { background: #E1F3EA; } .mx .s1 { background: #EEF3D9; } .mx .s2 { background: #FCEFD3; } .mx .s3 { background: #F9D9C4; } .mx .s4 { background: #F3BDBD; }
  .mx-foot { font-size: 11px; color: var(--muted); margin-top: 8px; }

  /* Tables */
  .tbl-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); padding: 5px 8px; border-bottom: 1px solid var(--ink); white-space: nowrap; background: var(--card); }
  th.num, td.num { text-align: right; }
  th button { border: 0; background: none; padding: 0; font-weight: 600; color: inherit; }
  th button:hover { color: var(--blue); }
  td { padding: 6px 8px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  td:first-child, th:first-child { min-width: 190px; }
  tbody tr.click:hover td { background: var(--canvas); }
  tr.total td { font-weight: 600; border-top: 1px solid var(--ink); border-bottom: 0; }
  tr.is-focus td { background: #F1F4FD; }
  .row-link { border: 0; background: none; padding: 0; color: var(--blue); font-weight: 600; text-align: left; }
  .row-link:hover { text-decoration: underline; }
  .sub2 { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
  .heat { display: inline-block; min-width: 38px; text-align: center; padding: 2px 6px; border-radius: 2px; font-weight: 600; }
  .heat.good { background: var(--good-bg); color: var(--good-ink); } .heat.warn { background: var(--warn-bg); color: var(--warn-ink); } .heat.bad { background: var(--bad-bg); color: var(--bad-ink); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; white-space: nowrap; background: var(--line-soft); color: var(--ink); }
  .pill.good { background: var(--good-bg); color: var(--good-ink); } .pill.warn { background: var(--warn-bg); color: var(--warn-ink); } .pill.bad { background: var(--bad-bg); color: var(--bad-ink); }
  .zero { color: #A7AEC2; }
  .scroll-y { max-height: 420px; overflow-y: auto; }
  .scroll-y thead th { position: sticky; top: 0; z-index: 1; }

  /* Records toolbar */
  .rec-bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 8px; }
  .rec-bar input { border: 1px solid var(--line); border-radius: 3px; padding: 5px 8px; min-width: 290px; max-width: 100%; background: var(--card); }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--navy); color: #fff; border-radius: 12px; padding: 2px 4px 2px 10px; font-size: 12px; }
  .chip button { border: 0; background: rgba(255,255,255,.18); color: #fff; border-radius: 50%; width: 18px; height: 18px; line-height: 16px; padding: 0; font-size: 12px; }
  .chip button:hover { background: rgba(255,255,255,.35); }
  .count { color: var(--muted); font-size: 12px; margin-left: auto; }
  .empty { padding: 28px 8px; text-align: center; color: var(--muted); }

  /* Supplier detail */
  .sup-head { grid-column: span 12; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--navy); border-radius: 3px; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: flex-end; justify-content: space-between; }
  .sup-head h2 { font-size: 22px; font-weight: 600; color: var(--navy); letter-spacing: -0.01em; }
  .sup-head .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 26px; }
  .facts div { font-size: 13px; }
  .facts span { display: block; font-size: 11px; color: var(--muted); }
  .note { grid-column: span 12; background: #F1F4FD; border: 1px solid #C9D2EA; border-radius: 3px; padding: 7px 12px; font-size: 12px; color: var(--ink); }
  .risk-score { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .risk-score .track { flex: 1; height: 10px; }
  .risk-score b { font-size: 22px; font-weight: 300; color: var(--navy); }
  .drivers { list-style: none; margin: 0; padding: 0; }
  .drivers li { display: grid; grid-template-columns: 76px 1fr; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line-soft); align-items: start; }
  .drivers .pill { justify-self: start; }
  .drivers b { font-weight: 600; }
  .drivers span.n { display: block; color: var(--muted); font-size: 12px; }

  /* Line chart */
  .chart { width: 100%; min-height: 200px; }
  .chart svg { display: block; width: 100%; height: 200px; }
  .chart text { font: 11px var(--font); fill: var(--muted); }
  .chart .pt { cursor: default; }

  /* Page tabs, as at the bottom of a Power BI report */
  .tabs { position: sticky; bottom: 0; display: flex; gap: 2px; background: #E7EBF5; border-top: 1px solid var(--line); margin: 0 -14px; padding: 0 14px; }
  .tabs button { border: 0; background: transparent; padding: 7px 16px 8px; font-size: 12px; color: var(--muted); border-top: 2px solid transparent; }
  .tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); font-weight: 600; border-top-color: var(--navy); }
  .tabs button:not(:disabled):hover { color: var(--ink); }
  .tabs button:disabled { color: #A7AEC2; }
  .tabs .demo { margin-left: auto; align-self: center; font-size: 11px; color: var(--muted); }

  #tip { position: fixed; z-index: 10; pointer-events: none; background: var(--ink); color: #fff; font-size: 12px; line-height: 1.45; padding: 6px 9px; border-radius: 3px; white-space: pre-line; max-width: 280px; display: none; box-shadow: 0 2px 8px rgba(14,31,82,.25); }

  @media (max-width: 1100px) {
    .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .c5, .c7, .c8 { grid-column: span 12; }
    .c3, .c4 { grid-column: span 6; }
  }
  @media (max-width: 720px) {
    body { padding: 10px 10px 0; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .c3, .c4 { grid-column: span 12; }
    .rail { flex-direction: column; }
    .rail .up { padding: 6px 12px; align-self: flex-start; }
    .rail ol { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .rail li:nth-child(3) { border-left: 0; }
    .rail li:nth-child(n+3) { border-top: 1px solid var(--line); }
    .tabs { margin: 0 -10px; padding: 0 10px; overflow-x: auto; }
    .tabs .demo { display: none; }
    .slicer select { min-width: 130px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .fill { transition: width .25s ease; }
  }
</style>
</head>

  /* ------------------------------------------------------------------
     Demo story. Change these names to match the rest of the demo; the
     ids point at the records in the data block above.
     ------------------------------------------------------------------ */
  var STORY = {
    supplierId: 'GS-10001', supplierName: 'Brackenfield Groundworks Ltd',
    businessAId: 'B02',     businessAName: 'Stanlow Geosciences',
    businessBId: 'B09',     businessBName: 'Redscar Drilling'
  };
  var EXPIRY_WINDOW = 60;   // days: "expiring soon"

  var DATA = JSON.parse(document.getElementById('ll-data').textContent);
  var TARGET = DATA.target.performance;
  var CRITERIA = ['Quality', 'Delivery', 'Health and safety', 'Commercial', 'ESG'];
  var RISKS = ['High', 'Medium', 'Low'];
  var COMPS = ['Compliant', 'Expiring soon', 'Non-compliant'];
  var SEGMENTS = ['Strategic', 'Key', 'Approved', 'Transactional'];

  /* ---------- indexes and derived fields ---------- */
  var divById = {}, bizById = {}, supById = {};
  DATA.divisions.forEach(function (d) { divById[d.id] = d; });
  DATA.businesses.forEach(function (b) { bizById[b.id] = b; });
  DATA.suppliers.forEach(function (s) { supById[s.id] = s; });
  if (supById[STORY.supplierId]) supById[STORY.supplierId].name = STORY.supplierName;
  if (bizById[STORY.businessAId]) bizById[STORY.businessAId].name = STORY.businessAName;
  if (bizById[STORY.businessBId]) bizById[STORY.businessBId].name = STORY.businessBName;

  DATA.suppliers.forEach(function (s) {
    var expired = 0, soon = 0;
    s.docs.forEach(function (d) {
      var x = d.expiresInDays;
      d.state = x === null ? 'Missing' : x < 0 ? 'Expired' : x <= EXPIRY_WINDOW ? 'Expiring' : 'Valid';
      if (d.state === 'Missing' || d.state === 'Expired') expired++;
      if (d.state === 'Expiring') soon++;
    });
    s.expired = expired; s.expiring = soon;
    s.comp = expired ? 'Non-compliant' : soon ? 'Expiring soon' : 'Compliant';
    s.validPct = s.docs.length ? (s.docs.length - expired) / s.docs.length * 100 : 100;
  });
  DATA.relationships.forEach(function (r) {
    r.sup = supById[r.supplierId]; r.biz = bizById[r.businessId]; r.divId = r.biz.divisionId;
    r.open = r.actions.filter(function (a) { return a.status !== 'Closed'; }).length;
  });
  var CATEGORIES = DATA.suppliers.map(function (s) { return s.category; })
    .filter(function (c, i, a) { return a.indexOf(c) === i; }).sort();

  /* ---------- dates: the demo data is relative to today ---------- */
  var TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
  function dateAt(offset) {
    return new Date(TODAY.getTime() + offset * 864e5).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  var MONTHS = [];
  for (var mi = 11; mi >= 0; mi--) {
    var md = new Date(TODAY.getFullYear(), TODAY.getMonth() - mi, 1);
    MONTHS.push(md.toLocaleDateString('en-GB', { month: 'short' }) + ' ' + String(md.getFullYear()).slice(2));
  }

  /* ---------- state ---------- */
  var params = new URLSearchParams(location.search);
  var lockScope = bizById[params.get('scope')] ? params.get('scope') : null;
  var state = {
    scope: lockScope || 'group',          // 'group' or a business id (row-level security)
    div: null, biz: null, sup: null,
    page: 'overview',
    metric: 'performance',
    f: { segment: '', risk: '', compliance: '', category: '' },
    rec: { measure: '', risk: '', comp: '', q: '', sort: 'name', dir: 1 }
  };
  function applyScope() {
    if (state.scope !== 'group') { state.biz = state.scope; state.div = bizById[state.scope].divisionId; }
    else { state.div = null; state.biz = null; }
    state.sup = null;
  }
  applyScope();
  if (!lockScope) {
    if (divById[params.get('division')]) state.div = params.get('division');
    if (bizById[params.get('business')]) { state.biz = params.get('business'); state.div = bizById[state.biz].divisionId; }
  }
  if (supById[params.get('supplier')]) state.sup = params.get('supplier');

  /* ---------- helpers ---------- */
  function esc(v) {
    return String(v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  function gbp(v) {
    if (v >= 1e6) return '£' + (v / 1e6).toFixed(v >= 1e7 ? 1 : 2) + 'm';
    if (v >= 1e3) return '£' + Math.round(v / 1e3) + 'k';
    return '£' + Math.round(v);
  }
  function n1(v) { return v === null ? 'n/a' : (Math.round(v * 10) / 10).toFixed(1); }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
  function ragPerf(v) { return v >= TARGET ? 'good' : v >= TARGET - 15 ? 'warn' : 'bad'; }
  function ragComp(v) { return v >= 90 ? 'good' : v >= 75 ? 'warn' : 'bad'; }
  function ragRiskScore(v) { return v >= 67 ? 'bad' : v >= 40 ? 'warn' : 'good'; }
  function ragTier(t) { return t === 'High' ? 'bad' : t === 'Medium' ? 'warn' : 'good'; }
  function ragCompState(c) { return c === 'Non-compliant' ? 'bad' : c === 'Expiring soon' ? 'warn' : 'good'; }
  function level() { return state.sup ? 'supplier' : state.biz ? 'business' : state.div ? 'division' : 'group'; }

  function slicerOk(s) {
    var f = state.f;
    return (!f.segment || s.segment === f.segment) && (!f.risk || s.risk.tier === f.risk) &&
           (!f.compliance || s.comp === f.compliance) && (!f.category || s.category === f.category);
  }
  function authorised(r) { return state.scope === 'group' || r.businessId === state.scope; }
  function scopeRels() {
    return DATA.relationships.filter(function (r) {
      return authorised(r) && slicerOk(r.sup) && (!state.div || r.divId === state.div) && (!state.biz || r.businessId === state.biz);
    });
  }
  function agg(rels) {
    var seen = {}, list = [], sum = 0, spend = 0, open = 0, withOpen = {};
    rels.forEach(function (r) {
      if (!seen[r.supplierId]) { seen[r.supplierId] = 1; list.push(r.sup); }
      sum += r.score; spend += r.spend; open += r.open; if (r.open) withOpen[r.supplierId] = 1;
    });
    var n = list.length, non = 0, high = 0, expiring = 0, expSup = 0;
    list.forEach(function (s) {
      if (s.comp === 'Non-compliant') non++;
      if (s.risk.tier === 'High') high++;
      expiring += s.expiring; if (s.expiring) expSup++;
    });
    return { n: n, rels: rels.length, list: list, perf: rels.length ? sum / rels.length : null, spend: spend, open: open,
             openSup: Object.keys(withOpen).length, non: non, high: high, expiring: expiring, expSup: expSup,
             compPct: n ? (n - non) / n * 100 : null };
  }
  function perSupplier(rels) {           // one row per supplier within the current scope
    var map = {};
    rels.forEach(function (r) {
      var m = map[r.supplierId] || (map[r.supplierId] = { s: r.sup, rels: [], sum: 0, open: 0, spend: 0 });
      m.rels.push(r); m.sum += r.score; m.open += r.open; m.spend += r.spend;
    });
    return Object.keys(map).map(function (k) { var m = map[k]; m.perf = m.sum / m.rels.length; return m; });
  }
  function children(rels) {
    var lv = level(), groups = {}, order = [];
    rels.forEach(function (r) {
      var id = lv === 'group' ? r.divId : lv === 'division' ? r.businessId : r.supplierId;
      if (!groups[id]) { groups[id] = []; order.push(id); }
      groups[id].push(r);
    });
    return order.map(function (id) {
      var name = lv === 'group' ? divById[id].name : lv === 'division' ? bizById[id].name : supById[id].name;
      return { id: id, name: name, rels: groups[id], a: agg(groups[id]) };
    });
  }
  var CHILD = { group: ['division', 'Division', 'Divisions'], division: ['business', 'Business entity', 'Business entities'], business: ['supplier', 'Supplier', 'Suppliers'] };

  /* ---------- header, drill rail, slicers ---------- */
  function headHtml() {
    var view;
    if (lockScope) {
      view = '<span>Access: <strong>' + esc(bizById[lockScope].name) + '</strong></span>';
    } else {
      var opts = '<option value="group">Group user: all divisions</option>';
      [STORY.businessAId, STORY.businessBId].forEach(function (id) {
        if (bizById[id]) opts += '<option value="' + esc(id) + '"' + (state.scope === id ? ' selected' : '') + '>Business user: ' + esc(bizById[id].name) + '</option>';
      });
      view = '<label for="scope">Viewing as</label><select id="scope" data-fid="scope">' + opts + '</select>';
    }
    return '<header class="head"><div><h1>Group supplier dashboard</h1>' +
      '<p class="sub">Current suppliers, performance, compliance and risk. Data refreshed ' + esc(dateAt(0)) + ', 06:00.</p></div>' +
      '<div class="viewas">' + view + '</div></header>';
  }

  function railHtml(rels) {
    var lv = level(), restricted = state.scope !== 'group';
    var sup = state.sup ? supById[state.sup] : null;
    var supRels = sup ? DATA.relationships.filter(function (r) { return r.supplierId === sup.id && authorised(r); }) : [];
    var a = agg(rels);
    var nDiv = {}, nBiz = {};
    (sup ? supRels : rels).forEach(function (r) { nDiv[r.divId] = 1; nBiz[r.businessId] = 1; });
    nDiv = Object.keys(nDiv).length; nBiz = Object.keys(nBiz).length;

    function seg(key, label, value, cls, clickable, title) {
      return '<li class="' + cls + '"><button class="seg" ' + (clickable ? 'data-act="goto" data-level="' + key + '" data-fid="rail-' + key + '"' : 'disabled') +
        (title ? ' title="' + esc(title) + '"' : '') + (cls === 'is-current' ? ' aria-current="true"' : '') + '>' +
        '<span class="seg-k">' + label + '</span><span class="seg-v">' + esc(value) + '</span></button></li>';
    }
    var out = '';
    // Group
    if (restricted) out += seg('group', 'Group', DATA.group.name, 'is-locked', false, 'Outside your access');
    else out += seg('group', 'Group', DATA.group.name, lv === 'group' ? 'is-current' : 'is-set', lv !== 'group');
    // Division
    if (state.div) out += restricted ? seg('division', 'Division', divById[state.div].name, 'is-locked', false, 'Outside your access')
                                     : seg('division', 'Division', divById[state.div].name, lv === 'division' ? 'is-current' : 'is-set', lv !== 'division');
    else out += seg('division', 'Division', (sup ? '' : 'All ') + plural(nDiv, 'division', 'divisions'), lv === 'group' ? 'is-open' : 'is-later', false);
    // Business entity
    if (state.biz) out += seg('business', 'Business entity', bizById[state.biz].name, lv === 'business' ? 'is-current' : 'is-set', lv !== 'business');
    else out += seg('business', 'Business entity', (sup ? '' : 'All ') + plural(nBiz, 'entity', 'entities'), lv === 'division' ? 'is-open' : 'is-later', false);
    // Supplier
    if (sup) out += seg('supplier', 'Supplier', sup.name, 'is-current', false);
    else out += seg('supplier', 'Supplier', 'All ' + plural(a.n, 'supplier', 'suppliers'), lv === 'business' ? 'is-open' : 'is-later', false);

    var canUp = lv === 'supplier' || (!restricted && lv !== 'group');
    return '<nav class="rail" aria-label="Drill path"><button class="up" data-act="up" data-fid="up"' + (canUp ? '' : ' disabled') +
      ' title="Go up one level">&#8593; Drill up</button><ol>' + out + '</ol></nav>';
  }

  function slicersHtml() {
    function sel(key, label, options) {
      var v = state.f[key];
      return '<label class="slicer">' + label + '<select data-slicer="' + key + '" data-fid="sl-' + key + '"' + (v ? ' class="on"' : '') + '>' +
        '<option value="">All</option>' + options.map(function (o) {
          return '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>';
        }).join('') + '</select></label>';
    }
    var any = state.f.segment || state.f.risk || state.f.compliance || state.f.category;
    return '<section class="slicers" aria-label="Filters">' +
      sel('segment', 'Supplier segment', SEGMENTS) + sel('risk', 'Risk tier', RISKS) +
      sel('compliance', 'Compliance status', COMPS) + sel('category', 'Category', CATEGORIES) +
      '<button class="link" data-act="reset" data-fid="reset"' + (any ? '' : ' disabled') + '>Clear filters</button></section>';
  }

  /* ---------- overview page ---------- */
  function kpiHtml(a) {
    var below = perSupplier(a._rels).filter(function (m) { return m.perf < TARGET; }).length;
    var nb = {}; a._rels.forEach(function (r) { nb[r.businessId] = 1; }); nb = Object.keys(nb).length;
    function card(measure, label, value, sub, tone) {
      return '<button class="kpi' + (tone ? ' t-' + tone : '') + '" data-act="measure" data-measure="' + measure + '" data-fid="kpi-' + measure +
        '" title="Show the supplier records behind this figure"><span class="kpi-l">' + label + '</span><span class="kpi-v">' + value +
        '</span><span class="kpi-s">' + sub + '</span></button>';
    }
    return '<div class="kpis">' +
      card('all', 'Current suppliers', a.n, plural(a.rels, 'relationship', 'relationships') + ' in ' + plural(nb, 'business entity', 'business entities')) +
      card('below', 'Average performance', a.perf === null ? 'n/a' : n1(a.perf) + '<small> / 100</small>', plural(below, 'supplier', 'suppliers') + ' below target ' + TARGET, a.perf === null ? '' : ragPerf(a.perf)) +
      card('non', 'Compliant suppliers', a.compPct === null ? 'n/a' : Math.round(a.compPct) + '<small>%</small>', a.non + ' with expired or missing documents', a.compPct === null ? '' : ragComp(a.compPct)) +
      card('high', 'High-risk suppliers', a.high, a.n ? Math.round(a.high / a.n * 100) + '% of current suppliers' : 'none in view', a.high ? 'bad' : 'good') +
      card('expiring', 'Documents expiring in ' + EXPIRY_WINDOW + ' days', a.expiring, 'across ' + plural(a.expSup, 'supplier', 'suppliers'), a.expiring ? 'warn' : 'good') +
      card('open', 'Open corrective actions', a.open, 'on ' + plural(a.openSup, 'supplier', 'suppliers'), a.open ? 'warn' : 'good') +
      '</div>';
  }

  function barHtml(kids) {
    var lv = level(), isSup = lv === 'business', m = state.metric, ch = CHILD[lv];
    var title, unit = '', max = 100, mark = null, legend = '';
    function val(k) {
      if (m === 'performance') return isSup ? k.rels[0].score : k.a.perf;
      if (m === 'compliance') return isSup ? k.rels[0].sup.validPct : k.a.compPct;
      return isSup ? k.rels[0].sup.risk.score : k.a.high;
    }
    function tone(v) {
      if (m === 'performance') return ragPerf(v);
      if (m === 'compliance') return ragComp(v);
      return isSup ? ragRiskScore(v) : 'neutral';
    }
    if (m === 'performance') { title = (isSup ? 'Performance score' : 'Average performance score') + ' by ' + ch[1].toLowerCase(); mark = TARGET;
      legend = '<span><i class="dash"></i>Target ' + TARGET + '</span><span><i style="background:var(--good)"></i>On target</span><span><i style="background:var(--warn)"></i>Up to 15 below</span><span><i style="background:var(--bad)"></i>More than 15 below</span>'; }
    else if (m === 'compliance') { title = (isSup ? 'Valid compliance documents' : 'Compliant suppliers') + ' by ' + ch[1].toLowerCase(); unit = '%';
      legend = '<span><i style="background:var(--good)"></i>90% or more</span><span><i style="background:var(--warn)"></i>75 to 89%</span><span><i style="background:var(--bad)"></i>Below 75%</span>'; }
    else if (isSup) { title = 'Risk score by supplier';
      legend = '<span><i style="background:var(--good)"></i>Low</span><span><i style="background:var(--warn)"></i>Medium</span><span><i style="background:var(--bad)"></i>High</span>'; }
    else { title = 'High-risk suppliers by ' + ch[1].toLowerCase(); max = Math.max.apply(null, kids.map(val).concat([1])); }

    var worstFirst = m === 'risk' ? -1 : 1;
    var rows = kids.slice().sort(function (a, b) { return (val(a) - val(b)) * worstFirst || a.name.localeCompare(b.name); });
    var body = rows.map(function (k) {
      var v = val(k), shown = (m === 'risk' && !isSup) ? v : (m === 'performance' && !isSup) ? n1(v) : Math.round(v);
      var tip = k.name + '\n' + (isSup
        ? 'Performance ' + k.rels[0].score + '\nRisk ' + k.rels[0].sup.risk.tier + ' (' + k.rels[0].sup.risk.score + ')\n' + k.rels[0].sup.comp
        : plural(k.a.n, 'supplier', 'suppliers') + '\nPerformance ' + n1(k.a.perf) + '\nCompliant ' + Math.round(k.a.compPct) + '%\nHigh risk ' + k.a.high) +
        '\nSelect to drill down';
      return '<button class="bar-row' + (k.id === STORY.supplierId ? ' is-story' : '') + '" data-act="drill" data-kind="' + ch[0] + '" data-id="' + esc(k.id) + '" data-fid="bar-' + esc(k.id) + '" data-tip="' + esc(tip) + '">' +
        '<span class="bar-n">' + esc(k.name) + '</span><span class="track"><span class="fill ' + tone(v) + '" style="width:' + Math.max(1, v / max * 100).toFixed(1) + '%"></span>' +
        (mark !== null ? '<span class="mark" style="left:' + mark + '%"></span>' : '') + '</span><span class="bar-v">' + shown + unit + '</span></button>';
    }).join('');
    function tg(key, label) { return '<button data-act="metric" data-metric="' + key + '" data-fid="m-' + key + '" aria-pressed="' + (m === key) + '">' + label + '</button>'; }
    return '<section class="vis c5"><div class="vis-h"><div><h2>' + title + '</h2><p>Sorted with the weakest first. Select a bar to drill down.</p></div>' +
      '<div class="seg-toggle" role="group" aria-label="Measure">' + tg('performance', 'Performance') + tg('compliance', 'Compliance') + tg('risk', 'Risk') + '</div></div>' +
      '<div class="bars">' + (body || '<p class="empty">No suppliers match the filters.</p>') + '</div>' + (legend ? '<div class="legend">' + legend + '</div>' : '') + '</section>';
  }

  function matrixHtml(a) {
    var counts = {};
    a.list.forEach(function (s) { var k = s.risk.tier + '|' + s.comp; counts[k] = (counts[k] || 0) + 1; });
    var h = '<div class="mx"><span></span>' + COMPS.map(function (c) { return '<span class="mx-h">' + c + '</span>'; }).join('');
    RISKS.forEach(function (r, ri) {
      h += '<span class="mx-r">' + r + ' risk</span>';
      COMPS.forEach(function (c, ci) {
        var n = counts[r + '|' + c] || 0, sev = (2 - ri) + ci;
        h += '<button class="s' + sev + '" data-act="cell" data-risk="' + r + '" data-comp="' + c + '" data-fid="mx-' + ri + ci + '"' + (n ? '' : ' disabled') +
          ' aria-label="' + n + ' suppliers, ' + r + ' risk, ' + c + '" data-tip="' + esc(r + ' risk, ' + c.toLowerCase() + '\n' + plural(n, 'supplier', 'suppliers') + (n ? '\nSelect to list them' : '')) + '">' + n + '</button>';
      });
    });
    return '<section class="vis c3"><div class="vis-h"><div><h2>Suppliers by risk and compliance</h2><p>Select a cell to see the records.</p></div></div>' + h +
      '</div><p class="mx-foot">Non-compliant: at least one required document is expired or missing.</p></section>';
  }

  function trendSeries(rels) {
    var out = [];
    for (var i = 0; i < 12; i++) { var s = 0; rels.forEach(function (r) { s += r.trend[i]; }); out.push(rels.length ? s / rels.length : null); }
    return out;
  }

  function tableHtml(kids, total) {
    var lv = level(), ch = CHILD[lv], isSup = lv === 'business';
    var head, rows;
    if (isSup) {
      head = '<th>Supplier</th><th>Segment</th><th class="num">Spend, 12 months</th><th class="num">Performance</th><th>Compliance</th><th>Risk</th><th class="num">Expiring documents</th><th class="num">Open actions</th>';
      rows = kids.slice().sort(function (a, b) { return a.rels[0].score - b.rels[0].score; }).map(function (k) {
        var r = k.rels[0], s = r.sup;
        return '<tr class="click"><td><button class="row-link" data-act="drill" data-kind="supplier" data-id="' + esc(s.id) + '" data-fid="t-' + esc(s.id) + '">' + esc(s.name) + '</button><span class="sub2">' + esc(s.category) + '</span></td>' +
          '<td>' + esc(s.segment) + '</td><td class="num">' + gbp(r.spend) + '</td><td class="num"><span class="heat ' + ragPerf(r.score) + '">' + r.score + '</span></td>' +
          '<td><span class="pill ' + ragCompState(s.comp) + '">' + s.comp + '</span></td><td><span class="pill ' + ragTier(s.risk.tier) + '">' + s.risk.tier + '</span></td>' +
          '<td class="num' + (s.expiring ? '' : ' zero') + '">' + s.expiring + '</td><td class="num' + (r.open ? '' : ' zero') + '">' + r.open + '</td></tr>';
      }).join('');
    } else {
      head = '<th>' + ch[1] + '</th><th class="num">Suppliers</th><th class="num">Spend, 12 months</th><th class="num">Performance</th><th class="num">Compliant</th><th class="num">High risk</th><th class="num">Expiring documents</th><th class="num">Open actions</th>';
      rows = kids.slice().sort(function (a, b) { return a.name.localeCompare(b.name); }).map(function (k) {
        var a = k.a;
        return '<tr class="click"><td><button class="row-link" data-act="drill" data-kind="' + ch[0] + '" data-id="' + esc(k.id) + '" data-fid="t-' + esc(k.id) + '">' + esc(k.name) + '</button>' +
          (lv === 'division' ? '<span class="sub2">ERP: ' + esc(bizById[k.id].erp) + '</span>' : '') + '</td>' +
          '<td class="num">' + a.n + '</td><td class="num">' + gbp(a.spend) + '</td><td class="num"><span class="heat ' + ragPerf(a.perf) + '">' + n1(a.perf) + '</span></td>' +
          '<td class="num"><span class="heat ' + ragComp(a.compPct) + '">' + Math.round(a.compPct) + '%</span></td><td class="num' + (a.high ? '' : ' zero') + '">' + a.high + '</td>' +
          '<td class="num' + (a.expiring ? '' : ' zero') + '">' + a.expiring + '</td><td class="num' + (a.open ? '' : ' zero') + '">' + a.open + '</td></tr>';
      }).join('');
    }
    var tot = total.n ? '<tr class="total"><td>Total</td>' + (isSup ? '<td></td>' : '<td class="num">' + total.n + '</td>') + '<td class="num">' + gbp(total.spend) + '</td><td class="num">' + n1(total.perf) + '</td>' +
      (isSup ? '<td>' + Math.round(total.compPct) + '% compliant</td><td>' + total.high + ' high</td>' : '<td class="num">' + Math.round(total.compPct) + '%</td><td class="num">' + total.high + '</td>') +
      '<td class="num">' + total.expiring + '</td><td class="num">' + total.open + '</td></tr>' : '';
    var note = isSup ? '' : (lv === 'group' ? 'A supplier used by several divisions is counted once in the total.' : 'A supplier used by several business entities is counted once in the total.');
    return '<section class="vis c12"><div class="vis-h"><div><h2>' + ch[2] + '</h2><p>Select a name to drill down. ' + note + '</p></div></div>' +
      '<div class="tbl-wrap' + (isSup ? ' scroll-y' : '') + '"><table><thead><tr>' + head + '</tr></thead><tbody>' +
      (rows || '<tr><td colspan="8" class="empty">No suppliers match the filters. Clear a filter to see records.</td></tr>') + tot + '</tbody></table></div></section>';
  }

  /* ---------- supplier records page ---------- */
  var MEASURES = { below: 'Performance below target ' + TARGET, non: 'Expired or missing documents', high: 'High risk', expiring: 'Documents expiring in ' + EXPIRY_WINDOW + ' days', open: 'Open corrective actions' };
  function recordRows(rels) {
    var rec = state.rec, q = rec.q.trim().toLowerCase();
    var rows = perSupplier(rels).filter(function (m) {
      var s = m.s;
      if (rec.measure === 'below' && !(m.perf < TARGET)) return false;
      if (rec.measure === 'non' && s.comp !== 'Non-compliant') return false;
      if (rec.measure === 'high' && s.risk.tier !== 'High') return false;
      if (rec.measure === 'expiring' && !s.expiring) return false;
      if (rec.measure === 'open' && !m.open) return false;
      if (rec.risk && s.risk.tier !== rec.risk) return false;
      if (rec.comp && s.comp !== rec.comp) return false;
      if (q && (s.name + ' ' + s.id + ' ' + s.category + ' ' + s.segment + ' ' + s.status).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    var key = rec.sort, dir = rec.dir, ro = { High: 3, Medium: 2, Low: 1 }, co = { 'Non-compliant': 3, 'Expiring soon': 2, Compliant: 1 };
    function v(m) {
      switch (key) {
        case 'perf': return m.perf; case 'biz': return m.rels.length; case 'risk': return ro[m.s.risk.tier] * 100 + m.s.risk.score;
        case 'comp': return co[m.s.comp]; case 'exp': return m.s.expiring; case 'open': return m.open; case 'spend': return m.spend;
        case 'seg': return SEGMENTS.indexOf(m.s.segment); default: return m.s.name.toLowerCase();
      }
    }
    rows.sort(function (a, b) { var x = v(a), y = v(b); return (x < y ? -1 : x > y ? 1 : a.s.name.localeCompare(b.s.name)) * dir; });
    return rows;
  }
  function recordBody(rows) {
    if (!rows.length) return '<tr><td colspan="9" class="empty">No supplier records match. Clear the search or a filter.</td></tr>';
    return rows.map(function (m) {
      var s = m.s;
      return '<tr class="click"><td><button class="row-link" data-act="drill" data-kind="supplier" data-id="' + esc(s.id) + '" data-fid="r-' + esc(s.id) + '">' + esc(s.name) + '</button><span class="sub2">' + esc(s.id) + ', ' + esc(s.category) + '</span></td>' +
        '<td>' + esc(s.segment) + '</td><td class="num">' + m.rels.length + '</td><td class="num">' + gbp(m.spend) + '</td>' +
        '<td class="num"><span class="heat ' + ragPerf(m.perf) + '">' + n1(m.perf) + '</span></td>' +
        '<td><span class="pill ' + ragCompState(s.comp) + '">' + s.comp + '</span></td><td><span class="pill ' + ragTier(s.risk.tier) + '">' + s.risk.tier + '</span></td>' +
        '<td class="num' + (s.expiring ? '' : ' zero') + '">' + s.expiring + '</td><td class="num' + (m.open ? '' : ' zero') + '">' + m.open + '</td></tr>';
    }).join('');
  }
  function recordsHtml(rels) {
    var rec = state.rec, rows = recordRows(rels), chips = '';
    function chip(label, what) { return '<span class="chip">' + esc(label) + '<button data-act="clearrec" data-what="' + what + '" aria-label="Remove filter: ' + esc(label) + '">&#215;</button></span>'; }
    if (rec.measure && MEASURES[rec.measure]) chips += chip(MEASURES[rec.measure], 'measure');
    if (rec.risk) chips += chip(rec.risk + ' risk', 'risk');
    if (rec.comp) chips += chip(rec.comp, 'comp');
    function th(key, label, num) {
      var on = rec.sort === key;
      return '<th' + (num ? ' class="num"' : '') + (on ? ' aria-sort="' + (rec.dir > 0 ? 'ascending' : 'descending') + '"' : '') + '><button data-act="sort" data-key="' + key + '" data-fid="s-' + key + '">' + label + (on ? (rec.dir > 0 ? ' &#9650;' : ' &#9660;') : '') + '</button></th>';
    }
    return '<section class="vis c12"><div class="vis-h"><div><h2>Supplier records</h2><p>The authorised records behind the figures at the current level. Select a supplier to open its detail.</p></div></div>' +
      '<div class="rec-bar"><input id="rec-q" type="search" placeholder="Search name, ID, category or status" aria-label="Search supplier records" value="' + esc(rec.q) + '">' + chips +
      '<span class="count" id="rec-count">' + plural(rows.length, 'supplier', 'suppliers') + '</span></div>' +
      '<div class="tbl-wrap"><table><thead><tr>' + th('name', 'Supplier') + th('seg', 'Segment') + th('biz', 'Business entities', 1) + th('spend', 'Spend, 12 months', 1) + th('perf', 'Performance', 1) +
      th('comp', 'Compliance') + th('risk', 'Risk') + th('exp', 'Expiring documents', 1) + th('open', 'Open actions', 1) + '</tr></thead><tbody id="rec-body">' + recordBody(rows) + '</tbody></table></div></section>';
  }

  /* ---------- supplier detail page ---------- */
  function supplierHtml() {
    var s = supById[state.sup];
    var rels = DATA.relationships.filter(function (r) { return r.supplierId === s.id && authorised(r); });
    var a = agg(rels), restricted = state.scope !== 'group';
    var nDiv = {}; rels.forEach(function (r) { nDiv[r.divId] = 1; }); nDiv = Object.keys(nDiv).length;
    var lowest = rels.slice().sort(function (x, y) { return x.score - y.score; })[0];
    var valid = s.docs.length - s.expired;
    var statusTone = s.status === 'Approved' ? 'good' : s.status === 'Suspended' ? 'bad' : 'warn';

    var h = '<div class="sup-head"><div><h2>' + esc(s.name) + '</h2><div class="pills">' +
      '<span class="pill ' + statusTone + '">Status: ' + esc(s.status) + '</span><span class="pill">' + esc(s.segment) + ' supplier</span>' +
      '<span class="pill ' + ragTier(s.risk.tier) + '">' + s.risk.tier + ' risk</span><span class="pill ' + ragCompState(s.comp) + '">' + s.comp + '</span></div></div>' +
      '<div class="facts"><div><span>Group supplier ID</span>' + esc(s.id) + '</div><div><span>Category</span>' + esc(s.category) + '</div><div><span>Country</span>' + esc(s.country) + '</div>' +
      '<div><span>Used by</span>' + plural(rels.length, 'business entity', 'business entities') + (restricted ? '' : ' in ' + plural(nDiv, 'division', 'divisions')) + '</div></div></div>';

    if (restricted) h += '<p class="note">Your access covers ' + esc(bizById[state.scope].name) + '. Group users see every RSK relationship with this supplier.</p>';
    else if (rels.length > 1) h += '<p class="note">One Group supplier record, ' + rels.length + ' local ERP vendor records. The table below compares the relationship in each business entity.</p>';

    function card(label, value, sub, tone) { return '<div class="kpi' + (tone ? ' t-' + tone : '') + '"><span class="kpi-l">' + label + '</span><span class="kpi-v">' + value + '</span><span class="kpi-s">' + sub + '</span></div>'; }
    h += '<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">' +
      card('Performance', n1(a.perf) + '<small> / 100</small>', rels.length > 1 ? 'Lowest: ' + esc(lowest.biz.name) + ', ' + lowest.score : 'Target ' + TARGET, ragPerf(a.perf)) +
      card('Compliance documents', valid + '<small> of ' + s.docs.length + ' valid</small>', s.expired ? plural(s.expired, 'document', 'documents') + ' expired or missing' : s.expiring ? plural(s.expiring, 'document expires', 'documents expire') + ' within ' + EXPIRY_WINDOW + ' days' : 'Nothing due within ' + EXPIRY_WINDOW + ' days', ragCompState(s.comp)) +
      card('Risk score', s.risk.score + '<small> / 100</small>', s.risk.tier + ' risk tier', ragTier(s.risk.tier)) +
      card('Open corrective actions', a.open, a.open ? 'See the action list below' : 'None open', a.open ? 'warn' : 'good') +
      card('Spend, 12 months', gbp(a.spend), 'across ' + plural(rels.length, 'business entity', 'business entities')) + '</div>';

    // Performance by business entity
    var rows = rels.slice().sort(function (x, y) { return x.score - y.score; }).map(function (r) {
      return '<tr' + (state.biz === r.businessId && !restricted ? ' class="is-focus"' : '') + '><td><b>' + esc(r.biz.name) + '</b><span class="sub2">' + esc(divById[r.divId].name) + '</span></td>' +
        '<td>' + esc(r.vendorId) + '<span class="sub2">' + esc(r.biz.erp) + '</span></td><td class="num">' + gbp(r.spend) + '</td>' +
        '<td class="num"><span class="heat ' + ragPerf(r.score) + '">' + r.score + '</span></td>' +
        CRITERIA.map(function (c) { return '<td class="num"><span class="heat ' + ragPerf(r.criteria[c]) + '">' + r.criteria[c] + '</span></td>'; }).join('') +
        '<td>' + dateAt(-r.lastReviewDaysAgo) + '</td><td class="num' + (r.open ? '' : ' zero') + '">' + r.open + '</td></tr>';
    }).join('');
    h += '<section class="vis c12"><div class="vis-h"><div><h2>Performance by business entity</h2><p>Latest scorecard per relationship, 0 to 100. Target ' + TARGET + '.</p></div></div>' +
      '<div class="tbl-wrap"><table><thead><tr><th>Business entity</th><th>ERP vendor ID</th><th class="num">Spend, 12 months</th><th class="num">Overall</th>' +
      CRITERIA.map(function (c) { return '<th class="num">' + c + '</th>'; }).join('') + '<th>Last review</th><th class="num">Open actions</th></tr></thead><tbody>' + rows + '</tbody></table></div></section>';

    // Trend
    h += '<section class="vis c5"><div class="vis-h"><div><h2>Performance trend, last 12 months</h2><p>' + (rels.length > 6 ? 'Average across business entities.' : 'One line per business entity.') + '</p></div></div><div class="chart" id="chart-sup"></div></section>';

    // Documents
    var docs = s.docs.slice().sort(function (x, y) { return (x.expiresInDays === null ? -1e9 : x.expiresInDays) - (y.expiresInDays === null ? -1e9 : y.expiresInDays); }).map(function (d) {
      var x = d.expiresInDays, tone = d.state === 'Valid' ? 'good' : d.state === 'Expiring' ? 'warn' : 'bad';
      var label = d.state === 'Missing' ? 'Missing' : d.state === 'Expired' ? 'Expired ' + plural(-x, 'day', 'days') + ' ago' : d.state === 'Expiring' ? 'Expires in ' + plural(x, 'day', 'days') : 'Valid';
      return '<tr><td>' + esc(d.type) + '</td><td>' + (x === null ? '<span class="zero">Not provided</span>' : dateAt(x)) + '</td><td><span class="pill ' + tone + '">' + label + '</span></td></tr>';
    }).join('');
    h += '<section class="vis c7"><div class="vis-h"><div><h2>Compliance documents</h2><p>Held once on the Group record and shared by every business entity.</p></div></div>' +
      '<div class="tbl-wrap"><table><thead><tr><th>Document</th><th>Expiry date</th><th>Status</th></tr></thead><tbody>' + docs + '</tbody></table></div></section>';

    // Risk
    h += '<section class="vis c5"><div class="vis-h"><div><h2>Risk profile</h2><p>Score from 0 (low) to 100 (high).</p></div></div>' +
      '<div class="risk-score"><b>' + s.risk.score + '</b><span class="track"><span class="fill ' + ragRiskScore(s.risk.score) + '" style="width:' + s.risk.score + '%"></span></span><span class="pill ' + ragTier(s.risk.tier) + '">' + s.risk.tier + '</span></div>' +
      '<ul class="drivers">' + s.risk.drivers.map(function (d) {
        return '<li><span class="pill ' + ragTier(d.level) + '">' + d.level + '</span><div><b>' + esc(d.label) + '</b><span class="n">' + esc(d.note) + '</span></div></li>';
      }).join('') + '</ul></section>';

    // Actions
    var acts = [];
    rels.forEach(function (r) { r.actions.forEach(function (x) { acts.push({ a: x, r: r }); }); });
    acts.sort(function (x, y) { return (x.a.status === 'Closed') - (y.a.status === 'Closed') || x.a.dueInDays - y.a.dueInDays; });
    var actRows = acts.map(function (o) {
      var x = o.a, closed = x.status === 'Closed', overdue = !closed && x.dueInDays < 0;
      return '<tr><td>' + esc(x.title) + '<span class="sub2">' + esc(x.criterion) + ', ' + esc(x.owner) + '</span></td><td>' + esc(o.r.biz.name) + '</td>' +
        '<td><span class="pill ' + (closed ? 'good' : x.status === 'Open' ? 'bad' : 'warn') + '">' + esc(x.status) + '</span></td>' +
        '<td>' + dateAt(x.dueInDays) + (overdue ? '<span class="sub2" style="color:var(--bad-ink)">Overdue by ' + plural(-x.dueInDays, 'day', 'days') + '</span>' : '') + '</td></tr>';
    }).join('');
    h += '<section class="vis c7"><div class="vis-h"><div><h2>Corrective actions</h2><p>Open actions first.</p></div></div><div class="tbl-wrap"><table><thead><tr><th>Action</th><th>Business entity</th><th>Status</th><th>Due</th></tr></thead><tbody>' +
      (actRows || '<tr><td colspan="4" class="empty">No corrective actions recorded.</td></tr>') + '</tbody></table></div></section>';

    var series;
    if (rels.length > 6) series = [{ name: 'Average', values: trendSeries(rels) }];
    else series = rels.map(function (r) { return { name: r.biz.name, values: r.trend }; });
    pendingCharts.push({ id: 'chart-sup', series: series });
    return h;
  }

  /* ---------- line chart (SVG) ---------- */
  var LINE = [['#0E1F52', ''], ['#1D4ED8', '6 3'], ['#0E8F8A', '2 3'], ['#7A4FD6', '8 3 2 3'], ['#B4531A', '4 2'], ['#5B6478', '1 3']];
  var pendingCharts = [];
  function drawChart(c) {
    var el = document.getElementById(c.id); if (!el) return;
    var series = c.series.filter(function (s) { return s.values.every(function (v) { return v !== null; }); });
    if (!series.length) { el.innerHTML = '<p class="empty">No trend data for this selection.</p>'; return; }
    var w = Math.max(260, el.clientWidth), hgt = 200, m = { l: 30, r: 14, t: 10, b: 22 };
    var all = [TARGET]; series.forEach(function (s) { all = all.concat(s.values); });
    var hi = Math.min(100, Math.ceil((Math.max.apply(null, all) + 3) / 10) * 10), lo = Math.floor((Math.min.apply(null, all) - 3) / 10) * 10;
    if (hi - lo < 20) lo = hi - 20;
    function x(i) { return m.l + i * (w - m.l - m.r) / 11; }
    function y(v) { return m.t + (hi - v) * (hgt - m.t - m.b) / (hi - lo); }
    var g = '';
    for (var t = lo; t <= hi; t += 10) g += '<line x1="' + m.l + '" x2="' + (w - m.r) + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="#E9EDF7"/><text x="' + (m.l - 6) + '" y="' + (y(t) + 4) + '" text-anchor="end">' + t + '</text>';
    var step = w < 380 ? 3 : 2;
    for (var i = 11; i >= 0; i -= step) g += '<text x="' + x(i) + '" y="' + (hgt - 6) + '" text-anchor="' + (i === 11 ? 'end' : 'middle') + '">' + MONTHS[i] + '</text>';
    g += '<line x1="' + m.l + '" x2="' + (w - m.r) + '" y1="' + y(TARGET) + '" y2="' + y(TARGET) + '" stroke="#1A2340" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="5 4"/>' +
      '<text x="' + (m.l + 4) + '" y="' + (y(TARGET) - 5) + '" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Target ' + TARGET + '</text>';
    series.forEach(function (s, si) {
      var st = LINE[si % LINE.length];
      g += '<polyline fill="none" stroke="' + st[0] + '" stroke-width="2" stroke-linejoin="round"' + (st[1] ? ' stroke-dasharray="' + st[1] + '"' : '') + ' points="' +
        s.values.map(function (v, i) { return x(i).toFixed(1) + ',' + y(v).toFixed(1); }).join(' ') + '"/>';
      s.values.forEach(function (v, i) {
        g += '<circle class="pt" cx="' + x(i).toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="' + (i === 11 ? 3.5 : 2.5) + '" fill="' + st[0] + '" stroke="#fff" stroke-width="1" data-tip="' + esc(s.name + '\n' + MONTHS[i] + ': ' + n1(v)) + '"/>';
      });
    });
    var legend = series.length > 1 ? '<div class="legend">' + series.map(function (s, si) {
      var st = LINE[si % LINE.length];
      return '<span><svg width="22" height="8" style="display:inline-block;width:22px;height:8px;vertical-align:0;margin-right:4px"><line x1="0" x2="22" y1="4" y2="4" stroke="' + st[0] + '" stroke-width="2"' + (st[1] ? ' stroke-dasharray="' + st[1] + '"' : '') + '/></svg>' + esc(s.name) + ', ' + Math.round(s.values[11]) + '</span>';
    }).join('') + '</div>' : '';
    el.innerHTML = '<svg viewBox="0 0 ' + w + ' ' + hgt + '" role="img" aria-label="Line chart of performance score by month, with the target at ' + TARGET + '">' + g + '</svg>' + legend;
  }

  /* ---------- render ---------- */
  var app = document.getElementById('app');
  var liveCharts = [];
  function render() {
    var fid = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.fid : null;
    pendingCharts = [];
    var rels = scopeRels(), lv = level(), h = headHtml() + railHtml(rels);
    if (lv === 'supplier') {
      h += '<main class="grid" id="main">' + supplierHtml() + '</main>';
    } else {
      var a = agg(rels); a._rels = rels;
      h += slicersHtml() + '<main class="grid" id="main">';
      if (state.page === 'records') {
        h += recordsHtml(rels);
      } else {
        var kids = children(rels);
        h += kpiHtml(a) + barHtml(kids) + matrixHtml(a) +
          '<section class="vis c4"><div class="vis-h"><div><h2>Average performance, last 12 months</h2><p>All relationships at the current level.</p></div></div><div class="chart" id="chart-trend"></div></section>' +
          tableHtml(kids, a);
        pendingCharts.push({ id: 'chart-trend', series: [{ name: 'Average performance', values: trendSeries(rels) }] });
      }
      h += '</main>';
    }
    function tab(key, label, on, disabled) {
      return '<button role="tab" data-act="page" data-page="' + key + '" data-fid="tab-' + key + '" aria-selected="' + on + '"' + (disabled ? ' disabled title="Select a supplier to open this page"' : '') + '>' + label + '</button>';
    }
    h += '<footer class="tabs" role="tablist" aria-label="Report pages">' + tab('overview', 'Overview', lv !== 'supplier' && state.page === 'overview') +
      tab('records', 'Supplier records', lv !== 'supplier' && state.page === 'records') + tab('detail', 'Supplier detail', lv === 'supplier', lv !== 'supplier') +
      '<span class="demo">Demonstration data</span></footer>';
    app.innerHTML = h;
    liveCharts = pendingCharts; liveCharts.forEach(drawChart);
    if (fid) { var el = app.querySelector('[data-fid="' + fid.replace(/"/g, '') + '"]'); if (el && !el.disabled) el.focus(); }
    hideTip();
  }

  /* ---------- interaction ---------- */
  function drillUp() {
    if (state.sup) { state.sup = null; return; }
    if (state.scope !== 'group') return;
    if (state.biz) state.biz = null; else if (state.div) state.div = null;
  }
  app.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
    var act = t.dataset.act, top = false;
    if (act === 'drill') {
      var kind = t.dataset.kind, id = t.dataset.id;
      if (kind === 'division') state.div = id;
      else if (kind === 'business') { state.biz = id; state.div = bizById[id].divisionId; }
      else { state.sup = id; top = true; }
    } else if (act === 'goto') {
      var lvl = t.dataset.level; state.sup = null;
      if (lvl === 'group') { state.div = null; state.biz = null; }
      else if (lvl === 'division') state.biz = null;
    } else if (act === 'up') drillUp();
    else if (act === 'metric') state.metric = t.dataset.metric;
    else if (act === 'page') { if (t.dataset.page !== 'detail') { state.page = t.dataset.page; state.sup = null; top = true; } }
    else if (act === 'measure') {
      var mm = t.dataset.measure;
      state.rec = { measure: mm === 'all' ? '' : mm, risk: '', comp: '', q: '', sort: mm === 'below' ? 'perf' : mm === 'expiring' ? 'exp' : mm === 'open' ? 'open' : 'name', dir: (mm === 'expiring' || mm === 'open') ? -1 : 1 };
      state.page = 'records'; top = true;
    } else if (act === 'cell') {
      state.rec = { measure: '', risk: t.dataset.risk, comp: t.dataset.comp, q: '', sort: 'perf', dir: 1 };
      state.page = 'records'; top = true;
    } else if (act === 'sort') {
      if (state.rec.sort === t.dataset.key) state.rec.dir *= -1; else { state.rec.sort = t.dataset.key; state.rec.dir = t.dataset.key === 'name' || t.dataset.key === 'seg' ? 1 : -1; }
    } else if (act === 'clearrec') state.rec[t.dataset.what] = '';
    else if (act === 'reset') state.f = { segment: '', risk: '', compliance: '', category: '' };
    render();
    if (top) window.scrollTo(0, 0);
  });
  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'scope') { state.scope = t.value; applyScope(); render(); }
    else if (t.dataset.slicer) { state.f[t.dataset.slicer] = t.value; render(); }
  });
  app.addEventListener('input', function (e) {
    if (e.target.id !== 'rec-q') return;
    state.rec.q = e.target.value;
    var rows = recordRows(scopeRels());
    document.getElementById('rec-body').innerHTML = recordBody(rows);
    document.getElementById('rec-count').textContent = plural(rows.length, 'supplier', 'suppliers');
  });

  /* tooltips */
  var tip = document.getElementById('tip');
  function hideTip() { tip.style.display = 'none'; }
  function placeTip(e) {
    var pad = 14, w = tip.offsetWidth, hh = tip.offsetHeight;
    var x = e.clientX + pad, y = e.clientY + pad;
    if (x + w > window.innerWidth - 4) x = e.clientX - w - pad;
    if (y + hh > window.innerHeight - 4) y = e.clientY - hh - pad;
    tip.style.left = Math.max(4, x) + 'px'; tip.style.top = Math.max(4, y) + 'px';
  }
  document.addEventListener('mousemove', function (e) {
    var t = e.target.closest ? e.target.closest('[data-tip]') : null;
    if (!t) { hideTip(); return; }
    tip.textContent = t.getAttribute('data-tip'); tip.style.display = 'block'; placeTip(e);
  });
  document.addEventListener('mouseleave', hideTip);

  var rz;
  window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { liveCharts.forEach(drawChart); }, 120); });

  render();
})();
</script>
</body>
</html>
